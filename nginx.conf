# ─── Upstream: PM2 serves the built React SPA on port 3039 ───────────────────
upstream greentv_dashboard {
    server 127.0.0.1:3039;
    keepalive 32;
}

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name dashboard.thegreentv.com;
    return 301 https://$host$request_uri;
}

# ─── HTTPS — main vhost ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name dashboard.thegreentv.com;

    # SSL certificates (managed by Certbot — update paths if different)
    ssl_certificate     /etc/letsencrypt/live/dashboard.thegreentv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.thegreentv.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options   "nosniff"                      always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "1; mode=block"                always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # ── API proxy → backend Node.js on port 4000 ──────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # ── Static assets with long-term cache ────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass         http://greentv_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        expires            1y;
        add_header         Cache-Control "public, immutable";
    }

    # ── SPA — all routes proxy to PM2 static server ───────────────────────
    location / {
        proxy_pass         http://greentv_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # SPA fallback already handled by PM2 --single flag
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}
